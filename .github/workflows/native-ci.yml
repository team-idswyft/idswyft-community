# Native CI is the release gate for the Testagram-owned fork
name: Testagram Native Identity CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Native build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build native stack
        run: |
          npm run build
          npm --workspace shared run build
          npm --workspace engine run build

      - name: Backend tests
        run: npm run test:backend

      - name: Production dependency audit
        run: |
          npm audit --audit-level=high --omit=dev
          npm --prefix backend audit --audit-level=high --omit=dev
          npm --prefix engine audit --audit-level=high --omit=dev
          npm --prefix frontend audit --audit-level=high --omit=dev
          npm --prefix shared audit --audit-level=high --omit=dev

      - name: Validate native deployment assets
        run: |
          test -f deploy/native/testagram-identity-api.service
          test -f deploy/native/testagram-identity-engine.service
          test -f deploy/native/testagram-identity-nginx.conf
          bash -n deploy/native/install-native.sh

  docker-runtime-forbidden:
    name: Enforce no Docker runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject Docker deployment artifacts
        run: |
          if find . -maxdepth 3 -type f \( -name 'Dockerfile*' -o -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' \) | grep -q .; then
            echo "Docker runtime artifact detected."
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='native-ci.yml' -E 'docker compose|docker-compose up|ghcr.io/team-idswyft|railway' deploy docs .github 2>/dev/null; then
            echo "Managed/container deployment reference detected in native deployment surfaces."
            exit 1
          fi
          echo "GREEN: native deployment surfaces contain no Docker/Railway runtime."
